name: Update language card

on:
  schedule:
    - cron: "0 3 * * *"   # every day at 03:00 UTC
  workflow_dispatch:       # run manually from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/languages_card.py"
      - ".github/workflows/languages.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install cairosvg

      - name: Generate card
        run: python scripts/languages_card.py
        env:
          GH_USER: ibrala
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages.png
          git diff --cached --quiet || git commit -m "Update language card"
          git push
